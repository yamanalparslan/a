{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-lg" 
                 style="width: 60px; height: 60px; background-color: #1e293b; border: 2px solid #d9f99d; color: #d9f99d; font-size: 1.5rem;">
                <i class="bi bi-unlock-fill"></i>
            </div>
            <h2 class="fw-bold text-white">Giriş Yap</h2>
            <p style="color: #94a3b8;">Hesabına erişmek için bilgilerini gir.</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4" style="background-color: #1e293b !important; color: #ffffff !important;">
            <div class="card-body p-4 p-md-5">
                
                <form method="post" id="loginForm">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger small rounded-3 mb-4" style="background-color: rgba(220, 38, 38, 0.1); border: 1px solid #dc2626; color: #fca5a5;">
                            <i class="bi bi-exclamation-circle me-1"></i> Kullanıcı adı veya şifre hatalı.
                        </div>
                    {% endif %}
                    
                  

                    <div class="mb-3">
                        <label class="form-label text-white small text-uppercase fw-bold" style="font-size: 0.75rem;">Kullanıcı Adı</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Kullanıcı adınızı girin" required id="id_username"
                               style="background-color: #0f172a; border-color: #334155; color: white;">
                    </div>

                    <div class="mb-2">
                        <label class="form-label text-white small text-uppercase fw-bold" style="font-size: 0.75rem;">Şifre</label>
                        
                        <input type="password" id="visible_password" class="form-control form-control-lg" placeholder="Şifrenizi girin" required
                               style="background-color: #0f172a; border-color: #334155; color: white;">

                        <input type="hidden" name="password" id="hidden_password">
                    </div>

                    <div class="d-flex justify-content-end mb-4">
                        <a href="{% url 'password_reset' %}" class="text-decoration-none small fw-bold hover-effect" style="color: #d9f99d;">
                            Şifreni mi unuttun?
                        </a>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-lg fw-bold rounded-3 shadow-sm hover-effect"
                                style="background-color: #d9f99d; color: #0f172a; border: none;">
                            Giriş Yap <i class="bi bi-arrow-right-short ms-1"></i>
                        </button>
                    </div>

                </form>
            </div>
            
            <div class="card-footer text-center py-3 border-0" style="background-color: rgba(0,0,0,0.2);">
                <small style="color: #94a3b8;">Hesabın yok mu? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none" style="color: #d9f99d;">Hemen Kayıt Ol</a></small>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        // 1. Formun otomatik gönderilmesini durdur
        e.preventDefault();

        const visibleInput = document.getElementById('visible_password');
        const hiddenInput = document.getElementById('hidden_password');
        const rawPassword = visibleInput.value;

        if (rawPassword) {
            try {
                // 2. Base64 Encode İşlemi (UTF-8 Karakter Desteği ile)
                // Türkçe karakterler (ğ, ü, ş, ö, ç, ı) bozulmasın diye encodeURIComponent kullanıyoruz.
                const encodedPassword = btoa(unescape(encodeURIComponent(rawPassword)));
                
                // 3. Şifrelenmiş veriyi gizli input'a yaz
                hiddenInput.value = encodedPassword;

                // 4. Görünür şifreyi temizle (Güvenlik hissi için)
                visibleInput.value = "";

                // 5. Formu manuel olarak gönder
                this.submit();
            } catch (err) {
                console.error("Şifreleme hatası:", err);
                alert("Giriş yapılırken bir hata oluştu. Lütfen tekrar deneyiniz.");
            }
        }
    });
</script>

{% endblock %}
