{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 text-center">
        
        <div class="card border-0 shadow-lg rounded-4 p-5" style="background-color: #1e293b !important; color: white;">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle shadow-lg" 
                     style="width: 80px; height: 80px; background-color: #d9f99d; color: #0f172a; font-size: 3rem;">
                    <i class="bi bi-check-lg"></i>
                </div>
            </div>
            
            <h2 class="fw-bold text-white mb-3">Harika!</h2>
            <p class="lead" style="color: #cbd5e1;">
                Şifreniz başarıyla güncellendi. Artık yeni şifrenizle hesabınıza giriş yapabilirsiniz.
            </p>
            
            <a href="{% url 'login' %}" class="btn btn-lg fw-bold mt-4 px-5 rounded-pill shadow-sm" 
               style="background-color: #d9f99d; color: #0f172a; border: none;">
                Giriş Yap
            </a>
        </div>

    </div>
</div>
{% endblock %}
