{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <div class="card shadow-lg border-0 p-5" style="background-color: #1e293b !important; color: white;">
            <div class="mb-3">
                <i class="bi bi-check-circle-fill" style="font-size: 4rem; color: #d9f99d;"></i>
            </div>
            <h3 class="fw-bold text-white">Şifreniz Değiştirildi!</h3>
            <p style="color: #94a3b8;" class="mt-3">
                Harika! Şifreniz başarıyla güncellendi. Artık yeni şifrenizle giriş yapabilirsiniz.
            </p>
            <a href="{% url 'login' %}" class="btn fw-bold mt-3 px-5 py-2 rounded-pill shadow-sm" 
               style="background-color: #d9f99d; color: #0f172a; border: none;">
                Giriş Yap
            </a>
        </div>
    </div>
</div>
{% endblock %}
