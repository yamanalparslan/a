{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        
        <div class="card border-0 shadow-lg rounded-4 text-center" style="background-color: #1e293b !important; color: #ffffff !important;">
            <div class="card-body p-5">
                
                <div class="mb-4">
                    <i class="bi bi-envelope-check-fill" style="font-size: 4rem; color: #d9f99d;"></i>
                </div>

                <h3 class="fw-bold text-white mb-3">E-posta Gönderildi!</h3>
                
                <p style="color: #cbd5e1;" class="fs-6">
                    E-posta adresini kontrol et. Şifreni sıfırlaman için sana özel bir bağlantı gönderdik.
                </p>

                <div class="alert alert-dark border-secondary mt-4 d-inline-block text-start" style="background-color: #0f172a; color: #94a3b8;">
                    <small>
                        <i class="bi bi-info-circle me-2 text-warning"></i>
                        E-postayı gelen kutunda bulamazsan, <strong>Spam/Gereksiz</strong> klasörüne bakmayı unutma.
                    </small>
                </div>

                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-outline-light rounded-pill px-4">Giriş Ekranına Dön</a>
                </div>

            </div>
        </div>

    </div>
</div>
{% endblock %}
