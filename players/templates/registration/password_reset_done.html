{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 text-center">
        <div class="card shadow-lg border-0 p-5" style="background-color: #1e293b !important; color: white;">
            <div class="mb-3">
                <i class="bi bi-envelope-check-fill" style="font-size: 4rem; color: #d9f99d;"></i>
            </div>
            <h3 class="fw-bold text-white">E-posta Gönderildi!</h3>
            <p style="color: #94a3b8;" class="mt-3 fs-5">
                E-posta adresini kontrol et. Şifreni sıfırlaman için bir bağlantı gönderdik.
            </p>
            <div class="alert alert-dark border-secondary mt-3" style="background-color: #0f172a; color: #94a3b8;">
                <small><i class="bi bi-info-circle me-1"></i> Spam klasörüne bakmayı unutma!</small>
            </div>
            <a href="{% url 'login' %}" class="btn btn-outline-light mt-4 rounded-pill px-4">Giriş Ekranına Dön</a>
        </div>
    </div>
</div>
{% endblock %}
