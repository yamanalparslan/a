{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 p-4" style="background-color: #1e293b !important; color: white;">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" 
                     style="width: 60px; height: 60px; background-color: #0f172a; color: #d9f99d; font-size: 1.5rem;">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h3 class="fw-bold text-white">Şifremi Unuttum</h3>
                <p style="color: #94a3b8;">Kayıtlı e-posta adresini gir, sana sıfırlama linki gönderelim.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control" placeholder="E-posta" required id="id_email"
                           style="background-color: #0f172a; border-color: #334155; color: white;">
                    <label class="text-muted">E-posta Adresi</label>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn fw-bold py-2 shadow-sm hover-scale" 
                            style="background-color: #d9f99d; color: #0f172a; border: none;">
                        Sıfırlama Linki Gönder
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
