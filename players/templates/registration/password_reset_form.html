{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 p-4" style="background-color: #1e293b !important; color: #ffffff !important;">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-white">Şifremi Unuttum 🔒</h2>
                <p style="color: #94a3b8;">Hesabınıza ait e-posta adresini girin, size sıfırlama bağlantısı gönderelim.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="alert alert-danger small rounded-3 mb-3">
                        Lütfen geçerli bir e-posta adresi girin.
                    </div>
                {% endif %}

                <div class="mb-4">
                    <label for="id_email" class="form-label text-white fw-bold small text-uppercase">E-posta Adresi</label>
                    <input type="email" name="email" autocomplete="email" required="" id="id_email" class="form-control p-3" placeholder="ornek@email.com" 
                           style="background-color: #0f172a; border-color: #334155; color: white;">
                </div>

                <button type="submit" class="btn btn-lg fw-bold rounded-3 shadow-sm hover-effect w-100"
                        style="background-color: #d9f99d; color: #0f172a; border: none;">
                    Sıfırlama Bağlantısı Gönder
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="text-decoration-none small" style="color: #94a3b8;">
                    <i class="bi bi-arrow-left"></i> Giriş Ekranına Dön
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
