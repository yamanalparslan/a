{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        
        <div class="card border-0 shadow-lg rounded-4" style="background-color: #1e293b !important; color: #ffffff !important;">
            <div class="card-body p-4 p-md-5 text-center">
                
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-4 shadow-lg" 
                     style="width: 70px; height: 70px; background-color: #0f172a; border: 2px solid #d9f99d; color: #d9f99d; font-size: 2rem;">
                    <i class="bi bi-key-fill"></i>
                </div>

                <h3 class="fw-bold text-white mb-2">Şifreni mi Unuttun?</h3>
                <p style="color: #94a3b8; font-size: 0.9rem;">Korkma, olur böyle şeyler. E-posta adresini gir, sana sıfırlama linki gönderelim.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    
                    <div class="form-floating mb-4 text-start">
                        <input type="email" name="email" class="form-control" placeholder="E-posta" required id="id_email"
                               style="background-color: #0f172a; border-color: #334155; color: white;">
                        <label class="text-muted">E-posta Adresi</label>
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-lg fw-bold rounded-3 shadow-sm hover-effect" 
                                style="background-color: #d9f99d; color: #0f172a; border: none;">
                            Sıfırlama Linki Gönder <i class="bi bi-send-fill ms-2"></i>
                        </button>
                        
                        <a href="{% url 'login' %}" class="btn btn-link text-decoration-none" style="color: #94a3b8;">
                            <i class="bi bi-arrow-left me-1"></i> Giriş Ekranına Dön
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
