{% extends 'players/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4 fw-bold" style="color: #ffffff !important;">🔔 Bildirimler</h2>
    
    <div class="row">
        <div class="col-md-10 col-lg-8">
            
            {% for notify in notifications %}
                <div class="card shadow-lg mb-3 border-0" 
                     style="background-color: #1e293b !important; color: #ffffff !important; border-left: 5px solid #d9f99d !important;">
                    
                    <div class="card-body d-flex justify-content-between align-items-center p-4">
                        
                        <div>
                            <h5 class="fw-bold mb-2" style="color: #d9f99d;">
                                <i class="bi bi-envelope-paper-fill me-2"></i> Maç Daveti!
                            </h5>
                            
                            <p class="card-text mb-2 fs-5 text-white">
                                {{ notify.message }}
                            </p>
                            
                            <small style="color: #94a3b8;">
                                <i class="bi bi-clock me-1"></i> {{ notify.created_at|date:"d M Y, H:i" }}
                            </small>
                        </div>
                        
                        <div class="ms-3">
                            <a href="{% url 'accept-match' notify.pk %}" class="btn fw-bold px-4 py-2 rounded-pill shadow-sm hover-effect"
                               style="background-color: #d9f99d; color: #0f172a; border: none; transition: transform 0.2s;">
                                ✅ Onayla
                            </a>
                        </div>

                    </div>
                </div>
            {% empty %}
                <div class="text-center p-5 rounded-4 border border-secondary" 
                     style="background-color: rgba(30, 41, 59, 0.5);">
                    <div class="fs-1 mb-3 opacity-50">📭</div>
                    <h4 class="text-white">Henüz yeni bir bildirim yok.</h4>
                    <p class="mb-0" style="color: #94a3b8;">Kimse seni maça davet etmemiş.</p>
                </div>
            {% endfor %}

        </div>
    </div>
</div>
{% endblock %}
