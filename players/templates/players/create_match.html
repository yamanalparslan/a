{% extends 'players/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0">
            <div class="card-header py-4 text-center">
                <h3 class="fw-bold mb-1">Maç Daveti Oluştur</h3>
                <p class="text-muted mb-0 small">Rakiplerini seç ve skorunu gir.</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4 p-3 rounded" style="background-color: rgba(217, 249, 157, 0.05); border: 1px solid rgba(217, 249, 157, 0.2);">
                        <label class="fw-bold mb-2" style="color: var(--lime);">Siz (Takım 1)</label>
                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-person-circle fs-4 me-2 text-white"></i>
                            <span class="fw-bold fs-5">{{ user.username }}</span>
                        </div>
                        <div class="form-floating">
                            {{ form.teammate }}
                            <label>Partnerin Kimdi? (Opsiyonel)</label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold mb-2 text-white">Rakipler (Takım 2)</label>
                        {{ form.team2_players }}
                        <div class="form-text text-muted">CTRL/CMD tuşuyla birden fazla seçebilirsiniz.</div>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label class="fw-bold mb-1" style="color: var(--lime);">Sizin Skor</label>
                            {{ form.score_team1 }}
                        </div>
                        <div class="col-6">
                            <label class="fw-bold mb-1 text-white">Rakip Skor</label>
                            {{ form.score_team2 }}
                        </div>
                    </div>

                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary py-3 fs-5">Davet Gönder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
